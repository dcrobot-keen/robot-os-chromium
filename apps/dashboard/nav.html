<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>nav — Phase 7 2D view</title>
<!-- planner-node.js imports '@ros-chromium/planner-wasm' by package name;
     the browser has no package resolver, so map it to the served path. -->
<script type="importmap">
{ "imports": { "@ros-chromium/planner-wasm": "/packages/planner-wasm/src/index.js" } }
</script>
<style>
  body { font-family: ui-monospace, monospace; margin: 0; background: #f4f4f4; color: #222; }
  header { padding: 10px 16px; background: #fff; border-bottom: 1px solid #ddd; }
  h1 { font-size: 15px; margin: 0 0 6px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; }
  button { font-family: inherit; padding: 5px 12px; }
  #status { font-weight: bold; }
  .connected { color: #2a7d2a; } .disconnected { color: #a33; }
  main { display: flex; gap: 12px; padding: 12px 16px; align-items: flex-start; }
  #view { background: #fff; border: 1px solid #ccc; cursor: crosshair; touch-action: none; }
  aside { width: 340px; font-size: 12px; }
  #log { background: #111; color: #ddd; padding: 8px; height: 340px; overflow-y: auto; font-size: 11px; white-space: pre-wrap; }
  .kv { margin: 3px 0; } .kv b { display: inline-block; width: 130px; color: #555; font-weight: normal; }
  .legend span { display: inline-block; margin-right: 10px; }
  .sw { display: inline-block; width: 10px; height: 10px; vertical-align: middle; margin-right: 3px; border: 1px solid #999; }
</style>
</head>
<body>
  <header>
    <h1>nav — 시뮬레이터 상대 in-browser Nav 스택 (roadmap.md Phase 7–8)</h1>
    <div class="controls">
      Connection: <span id="status" class="disconnected">disconnected</span>
      <button id="connectBtn">Connect</button>
      <button id="mapBtn" disabled>Start mapping</button>
      <button id="enableBtn" disabled>Enable (!MG)</button>
      <button id="estopBtn" disabled>E-STOP</button>
      <button id="clearBtn" disabled>Clear goal/path</button>
      <button id="resetMapBtn" disabled>Reset map</button>
      <button id="saveMapBtn" disabled>Save map</button>
      <button id="loadMapBtn" disabled>Load map</button>
      <label>iPhone map: <input type="file" id="sliceFile" accept=".json" /></label>
      <button id="setPoseBtn" disabled>Set pose (click)</button>
      <label><input type="checkbox" id="showOdom" checked /> odom ghost</label>
      <span class="sep"></span>
      <label>VDA5050 broker <input id="mqttUrl" value="ws://127.0.0.1:9001" size="20" /></label>
      <label>serial <input id="robotSerial" value="tb3-nav-01" size="10" /></label>
      <button id="vdaBtn" disabled>Connect VDA5050</button>
      <label>VPS <input id="vpsUrl" placeholder="http://127.0.0.1:8000" size="20" /></label>
      <button id="vpsBtn" disabled>Start VPS fix</button>
      <label><input type="checkbox" id="showScan" checked /> laser</label>
      <span class="legend">
        <span><i class="sw" style="background:#1e1e1e"></i>p(wall)→1</span>
        <span><i class="sw" style="background:#fff"></i>free</span>
        <span><i class="sw" style="background:#96d2"></i>inflated</span>
        <span><i class="sw" style="background:#e5484d"></i>scan</span>
        <span><i class="sw" style="background:#2a7d2a"></i>pose</span>
        <span><i class="sw" style="background:#3060c0"></i>path</span>
      </span>
    </div>
  </header>

  <main>
    <canvas id="view" width="760" height="560"></canvas>
    <aside>
      <div class="kv"><b>fused pose</b><span id="kPose">–</span></div>
      <div class="kv"><b>odom pose</b><span id="kOdom">–</span></div>
      <div class="kv"><b>drift (gt−odom)</b><span id="kDrift">–</span></div>
      <div class="kv"><b>localization</b><span id="kLoc">–</span></div>
      <div class="kv"><b>map cells</b><span id="kMap">–</span></div>
      <div class="kv"><b>last plan</b><span id="kPlan">–</span></div>
      <div class="kv"><b>cmd_vel</b><span id="kCmd">–</span></div>
      <div class="kv"><b>vda5050</b><span id="kVda">–</span></div>
      <div class="kv"><b>vps fix</b><span id="kVps">–</span></div>
      <div id="log"></div>
    </aside>
  </main>

  <script type="module">
    import { WebSocketTransport, startHeartbeat } from '../../packages/transport/src/index.js';
    import { loadManifest, createDriveDevice } from '../../packages/device-abstraction/src/index.js';
    import { LocalBus } from '../../packages/bus/src/index.js';
    import {
      OdometryNode, PoseFusionNode, MapNode, PlannerNode, PathFollowerNode,
      gridConfigFromBounds,
      LocalizationNode, CostmapNode, buildLikelihoodField, parseSlicemap, slicemapGrid, wallMaskFromSlicemap,
      Vda5050Node, adaptMqttJsClient, VpsCorrectionNode, createVpsLocalizeClient,
    } from '../../packages/nodes/src/index.js';

    const ROBOTEQ_URL = 'ws://127.0.0.1:8765';
    const SENSOR_URL = 'ws://127.0.0.1:8766';
    const MANIFEST_URL = '/manifests/tb3-sim.manifest.json';
    const R = 'sim';
    const T = {
      odom: `${R}/odom`, corr: `${R}/correction`, pose: `${R}/pose`, scan: `${R}/scan`,
      map: `${R}/map`, costmap: `${R}/costmap`,
      planReq: `${R}/plan-request`, planRes: `${R}/plan-result`,
      path: `${R}/path`, cmd: `${R}/drive/cmd_vel`, estop: `${R}/estop`,
    };
    // Real-robot hooks (doc/vda5050-rcs.md): the RCS (pathfinder) talks VDA5050 over
    // MQTT to this page, and VPS (vps-system /localize) replaces the ground-truth
    // correction stand-in. Both are opt-in buttons so the simulator-only flow is unchanged.
    let vdaNode = null, mqttClient = null, vpsNode = null, vpsStream = null;
    const MAX_DEVIATION_M = 0.8; // safety stop: fused pose this far off the path -> drop it
    const GRID = gridConfigFromBounds({ minX: -1, minY: -1, maxX: 16, maxY: 12 }, 0.05);
    const INFLATION_M = 0.18;
    const CORRECTION_MS = 1500, SIG_M = 0.04, SIG_RAD = 0.03;

    const $ = (id) => document.getElementById(id);
    const canvas = $('view'), ctx = canvas.getContext('2d');
    const statusEl = $('status'), logEl = $('log');
    const LOG_LINES = 200; // cap so a long session doesn't grow one giant text node
    const logBuf = [];
    const log = (m) => {
      logBuf.push(`[${new Date().toISOString().slice(11, 19)}] ${m}`);
      if (logBuf.length > LOG_LINES) logBuf.splice(0, logBuf.length - LOG_LINES);
      logEl.textContent = logBuf.join('\n'); logEl.scrollTop = logEl.scrollHeight;
      console.log('[nav] ' + m);
    };
    window.addEventListener('error', (e) => log(`window error: ${e.message} @ ${e.filename}:${e.lineno}`));
    window.addEventListener('unhandledrejection', (e) => log(`unhandled rejection: ${e.reason?.message || e.reason}`));

    // The view fits `viewGrid` (GRID by default; the loaded slicemap's grid
    // once an iPhone map is loaded). setViewGrid() recomputes the transform.
    let viewGrid = GRID, gridW, gridH, scale, offX, offY;
    const PAD = 16;
    function setViewGrid(g) {
      viewGrid = g;
      gridW = g.cols * g.cellSize; gridH = g.rows * g.cellSize;
      scale = Math.min((canvas.width - 2 * PAD) / gridW, (canvas.height - 2 * PAD) / gridH);
      offX = PAD + (canvas.width - 2 * PAD - gridW * scale) / 2;
      offY = PAD + (canvas.height - 2 * PAD - gridH * scale) / 2;
    }
    setViewGrid(GRID);
    const sx = (wx) => offX + (wx - viewGrid.originX) * scale;
    const sy = (wy) => canvas.height - offY - (wy - viewGrid.originY) * scale;
    const toWorld = (cx, cy) => ({
      x: (cx - offX) / scale + viewGrid.originX,
      y: (canvas.height - offY - cy) / scale + viewGrid.originY,
    });
    const gaussian = (s) => {
      let u = 0, v = 0;
      while (u === 0) u = Math.random();
      while (v === 0) v = Math.random();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v) * s;
    };
    const fmtPose = (p) => `x ${p.x.toFixed(2)}  y ${p.y.toFixed(2)}  θ ${p.theta.toFixed(2)}`;

    let mapBitmap = null, mapCounts = { occ: 0, inf: 0 };
    let fusedPose = null, odomPose = null, groundTruth = null;
    let latestScan = null, path = null, goal = null;
    let drawErrLogged = false;

    const mapCanvas = document.createElement('canvas');
    const mapCtx = mapCanvas.getContext('2d');
    function rasterizeMap(map) {
      const { cols, rows, occupied, occupiedInflated, prob } = map;
      mapCanvas.width = cols; mapCanvas.height = rows;
      const img = mapCtx.createImageData(cols, rows);
      let occ = 0, inf = 0;
      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const gi = row * cols + col;
          const pi = ((rows - 1 - row) * cols + col) * 4;
          // grayscale by probability: p=0 free -> white, p=0.5 unknown ->
          // faint, p=1 wall -> black. Phase 8's log-odds map is continuous.
          if (prob) {
            const p = prob[gi] / 255;
            if (p > 0.5) {
              const g = Math.round(255 * (1 - (p - 0.5) * 2)); // 0.5->255, 1->0
              img.data[pi] = g; img.data[pi + 1] = g; img.data[pi + 2] = g; img.data[pi + 3] = 255;
            } else if (p < 0.48) {
              img.data[pi] = 255; img.data[pi + 1] = 255; img.data[pi + 2] = 255; img.data[pi + 3] = 255;
            } // p ~= 0.5 -> transparent (unknown)
          }
          if (occupied[gi]) occ++;
          if (occupiedInflated[gi] && !occupied[gi]) {
            img.data[pi] = 150; img.data[pi + 1] = 150; img.data[pi + 2] = 210; img.data[pi + 3] = 120; inf++;
          }
        }
      }
      mapCtx.putImageData(img, 0, 0);
      mapBitmap = mapCanvas; mapCounts = { occ, inf };
    }

    function drawPose(p, color, dashed) {
      const r = 0.11 * scale;
      ctx.save();
      ctx.translate(sx(p.x), sy(p.y));
      ctx.rotate(-p.theta);
      ctx.strokeStyle = color; ctx.lineWidth = 2;
      ctx.setLineDash(dashed ? [4, 3] : []);
      ctx.beginPath(); ctx.arc(0, 0, r, 0, 2 * Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r * 1.8, 0); ctx.stroke();
      ctx.restore();
    }

    // --- perf watchdog: log if a frame or the sensor handler runs long ---
    let perfFrames = 0, perfSlow = 0, perfLastReport = 0;
    function perfTick(dt) {
      perfFrames++;
      if (dt > 60) perfSlow++;
      const now = performance.now();
      if (now - perfLastReport > 5000) {
        if (perfSlow > 0) log(`perf: ${perfSlow}/${perfFrames} frames >60ms in the last 5s`);
        perfFrames = perfSlow = 0; perfLastReport = now;
      }
    }

    function draw() {
      const _t0 = performance.now();
      try {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#ddd'; ctx.setLineDash([]);
        ctx.strokeRect(sx(viewGrid.originX), sy(viewGrid.originY + gridH), gridW * scale, gridH * scale);
        if (mapBitmap) {
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(mapBitmap, sx(viewGrid.originX), sy(viewGrid.originY + gridH), gridW * scale, gridH * scale);
        }
        if ($('showScan').checked && latestScan && fusedPose) {
          ctx.fillStyle = '#e5484d';
          const s = latestScan;
          for (let i = 0; i < s.ranges.length; i++) {
            const rng = s.ranges[i];
            if (!(rng > 0) || rng >= s.rangeMax - 1e-6) continue;
            const a = fusedPose.theta + s.angleMin + i * s.angleIncrement;
            ctx.fillRect(sx(fusedPose.x + rng * Math.cos(a)) - 1, sy(fusedPose.y + rng * Math.sin(a)) - 1, 2, 2);
          }
        }
        if (path && path.length) {
          ctx.strokeStyle = '#3060c0'; ctx.lineWidth = 2; ctx.setLineDash([]);
          ctx.beginPath(); ctx.moveTo(sx(path[0][0]), sy(path[0][1]));
          for (const [x, y] of path.slice(1)) ctx.lineTo(sx(x), sy(y));
          ctx.stroke();
        }
        if (goal) {
          ctx.strokeStyle = '#c060c0'; ctx.lineWidth = 2; ctx.setLineDash([]);
          const g = 6;
          ctx.beginPath();
          ctx.moveTo(sx(goal.x) - g, sy(goal.y)); ctx.lineTo(sx(goal.x) + g, sy(goal.y));
          ctx.moveTo(sx(goal.x), sy(goal.y) - g); ctx.lineTo(sx(goal.x), sy(goal.y) + g);
          ctx.stroke();
        }
        if ($('showOdom').checked && odomPose) drawPose(odomPose, '#999', true);
        if (fusedPose) drawPose(fusedPose, '#2a7d2a', false);
      } catch (err) {
        if (!drawErrLogged) { drawErrLogged = true; log(`draw() error: ${err.message}`); }
      }
      perfTick(performance.now() - _t0);
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    let transport = null, bus = null, sensorWs = null, heartbeat = null, drive = null, manifest = null;
    let odomNode = null, fusionNode = null, mapNode = null, plannerNode = null, followerNode = null;
    let reqSeq = 0, lastReqId = null, lastCorrectionAt = 0, poseReady = false, mapping = false;
    let loadedSlice = null, loadedField = null, locNode = null, setPoseArmed = false;
    let costmapNode = null, costmapLatest = null;

    $('connectBtn').addEventListener('click', async () => {
      if (transport) return;
      $('connectBtn').disabled = true;
      try {
        log(`[1] loading manifest ${MANIFEST_URL}`);
        manifest = await loadManifest(MANIFEST_URL);
        const geometry = manifest.drive.geometry;
        log(`    manifest ${manifest.robot}, geometry ${JSON.stringify(geometry)}`);

        log(`[2] connecting ${ROBOTEQ_URL}`);
        transport = new WebSocketTransport(ROBOTEQ_URL);
        bus = new LocalBus(`ros-chromium/nav/${R}`);
        await transport.connect();
        statusEl.textContent = 'connected'; statusEl.className = 'connected';
        log(`    connected`);

        log(`[3] bring-up + keepalive`);
        for (const line of manifest.drive.commands.init ?? []) {
          await transport.send(transport.encode(line));
          await new Promise((r) => setTimeout(r, 30));
        }
        drive = createDriveDevice(transport, manifest);
        heartbeat = startHeartbeat(transport, { onSendError: (e) => log(`keepalive err: ${e.message || e}`) });
        await drive.enable(); // !MG — motors come up disabled; the button re-arms after E-STOP / watchdog
        log(`    !MG — motors enabled`);

        log(`[4] OdometryNode + PoseFusionNode`);
        odomNode = new OdometryNode(bus, transport, {
          poseTopic: T.odom, geometry, encoderQuery: manifest.drive.readback?.encoder,
        });
        fusionNode = new PoseFusionNode(bus, { odomTopic: T.odom, correctionTopic: T.corr, fusedTopic: T.pose });

        bus.subscribe(T.odom, (p) => { odomPose = p; $('kOdom').textContent = fmtPose(p); });
        bus.subscribe(T.pose, (p) => { fusedPose = p; $('kPose').textContent = fmtPose(p); });
        bus.subscribe(T.cmd, async ({ left, right }) => {
          $('kCmd').textContent = `L ${left.toFixed(2)}  R ${right.toFixed(2)}`;
          try { await drive.setVelocity(left, right); } catch (e) { log(`setVelocity: ${e.message || e}`); }
        });

        log(`[5] ready — click "Start mapping" to bring up MapNode/Planner/Follower + sensor stream`);
        for (const b of ['mapBtn', 'enableBtn', 'estopBtn', 'clearBtn']) $(b).disabled = false;
      } catch (err) {
        log(`connect failed at some stage: ${err.stack || err.message || err}`);
        statusEl.textContent = 'error'; statusEl.className = 'disconnected';
      }
    });

    $('mapBtn').addEventListener('click', () => {
      if (mapping || !bus) return;
      mapping = true; $('mapBtn').disabled = true;
      for (const b of ['resetMapBtn', 'saveMapBtn', 'loadMapBtn']) $(b).disabled = false;
      const geometry = manifest.drive.geometry;

      // If an iPhone-scan slicemap was loaded, its frame is the map frame and
      // it seeds the log-odds prior; otherwise MapNode builds from scratch.
      const mapGrid = loadedSlice ? slicemapGrid(loadedSlice) : GRID;
      log(`[m1] MapNode (grid ${mapGrid.cols}x${mapGrid.rows} @ ${mapGrid.cellSize}m${loadedSlice ? ', iPhone prior' : ''})`);
      mapNode = new MapNode(bus, {
        scanTopic: T.scan, poseTopic: T.pose, mapTopic: T.map,
        grid: mapGrid, inflationRadius: INFLATION_M, publishHz: 1,
      });
      if (loadedSlice) mapNode.load(loadedSlice);
      bus.subscribe(T.map, (m) => {
        rasterizeMap(m);
        $('kMap').textContent = `${mapCounts.occ} wall / ${mapCounts.inf} inflated of ${m.cols}x${m.rows}`;
      });

      log(`[m2] PlannerNode (loads WASM) + PathFollowerNode`);
      plannerNode = new PlannerNode(bus, { requestTopic: T.planReq, pathTopic: T.planRes });
      followerNode = new PathFollowerNode(bus, {
        pathTopic: T.path, poseTopic: T.pose, cmdTopic: T.cmd, geometry,
        maxDeviationM: MAX_DEVIATION_M,
        costmapTopic: T.costmap,
        onGoalReached: () => { log('goal reached'); path = null; goal = null; vdaNode?.completeOrder(); },
        onAbort: ({ reason, distance, limit }) => {
          log(`SAFETY STOP: ${reason} -- ${distance.toFixed(2)} m off the path (limit ${limit} m)`);
          path = null; goal = null;
          vdaNode?.abortOrder(reason, `fused pose ${distance.toFixed(2)} m from the path (limit ${limit} m)`);
        },
        onBlocked: ({ path: p, pose }) => {
          if (!goal) return;
          const map = costmapLatest ?? mapNode?.snapshot();
          if (!map) return;
          log('path blocked by obstacle ahead — replanning...');
          lastReqId = `replan-${++reqSeq}`;
          bus.publish(T.planReq, {
            requestId: lastReqId,
            originX: map.originX, originY: map.originY, cellSize: map.cellSize, cols: map.cols, rows: map.rows,
            occupied: map.occupiedInflated,
            start: { x: pose.x, y: pose.y },
            goal: { x: goal.x, y: goal.y },
            algorithm: 'gridastar',
          });
        },
      });
      // orders from the RCS arrive on T.path via Vda5050Node -- draw them like a local plan
      bus.subscribe(T.path, ({ path: p }) => { path = p && p.length ? p : null; });
      $('vdaBtn').disabled = false;
      $('vpsBtn').disabled = false;
      bus.subscribe(T.planRes, ({ requestId, path: p, distance, error }) => {
        if (requestId !== lastReqId) return;
        if (error) { log(`plan failed: ${error}`); $('kPlan').textContent = `failed: ${error}`; path = null; return; }
        path = p; $('kPlan').textContent = `${p.length} pts, ${distance.toFixed(2)} m`;
        bus.publish(T.path, { path: p });
        log(`plan ok: ${p.length} pts, ${distance.toFixed(2)} m`);
      });

      if (loadedField) {
        log(`[m2b] LocalizationNode (scan-match vs the iPhone map -> correction)`);
        locNode = new LocalizationNode(bus, {
          scanTopic: T.scan, odomTopic: T.odom, correctionTopic: T.corr,
          likelihoodField: loadedField, minScore: 0.25, lostAfter: 8,
          onEvent: (e) => {
            $('kLoc').textContent = `${e.type} · score ${e.score.toFixed(2)}${e.lost ? ' · LOST' : ''}`;
            if (e.type === 'lost' || e.type === 'relocalized') log(`localization: ${e.type} (${e.score.toFixed(2)})`);
          },
        });
        $('setPoseBtn').disabled = false;
        log(`    set an initial pose: "Set pose (click)" then click the robot's spot`);

        // CostmapNode: hard static walls (from the slice) OR MapNode's live
        // map -> the grid the planner uses. Walls never erode; moved
        // furniture / new obstacles ride the live layer.
        costmapNode = new CostmapNode(bus, {
          mapTopic: T.map, costmapTopic: T.costmap, poseTopic: T.pose,
          staticOccupied: wallMaskFromSlicemap(loadedSlice),
          grid: mapGrid, inflationRadius: INFLATION_M, dynThreshold: 0.6,
          onUpdate: (cm) => { costmapLatest = cm; },
        });
        log(`[m2c] CostmapNode (static walls + live obstacles)`);
      }

      log(`[m3] sensor stream ${SENSOR_URL}`);
      sensorWs = new WebSocket(SENSOR_URL);
      sensorWs.binaryType = 'arraybuffer';
      sensorWs.addEventListener('open', () => log(`    sensor connected`));
      sensorWs.addEventListener('error', () => log(`    sensor ws error`));
      let frameCount = 0;
      let sensorSlow = 0, sensorReport = 0;
      sensorWs.addEventListener('message', (ev) => {
        const _st = performance.now();
        try {
          const msg = JSON.parse(typeof ev.data === 'string' ? ev.data : new TextDecoder().decode(ev.data));
          if (msg.type !== 'frame') return;
          groundTruth = msg.groundTruth;
          latestScan = msg.scan;
          if (++frameCount % 30 === 0) log(`    ${frameCount} sensor frames`);

          const now = Date.now();
          // LocalizationNode drives `correction` from scan matching when the
          // iPhone map is loaded; otherwise fall back to the throttled+noisy
          // ground-truth stand-in for a VPS fix.
          if (!locNode && !vpsNode && now - lastCorrectionAt >= CORRECTION_MS) {
            lastCorrectionAt = now;
            bus.publish(T.corr, {
              x: groundTruth.x + gaussian(SIG_M),
              y: groundTruth.y + gaussian(SIG_M),
              theta: groundTruth.theta + gaussian(SIG_RAD),
            });
          }
          // hold scans until we have a pose to fold them at: a correction has
          // landed (VPS stand-in) or the user set an initial pose (localization).
          const havePose = locNode ? !!locNode.getPose() : (Date.now() - lastCorrectionAt < CORRECTION_MS * 2);
          if (havePose && !poseReady) { poseReady = true; log('    scans flowing'); }
          if (poseReady) bus.publish(T.scan, latestScan);
          if (groundTruth && odomPose) {
            $('kDrift').textContent = `${Math.hypot(groundTruth.x - odomPose.x, groundTruth.y - odomPose.y).toFixed(3)} m`;
          }
        } catch (err) {
          log(`sensor handler error: ${err.message}`);
        }
        const dt = performance.now() - _st;
        if (dt > 40) sensorSlow++;
        if (performance.now() - sensorReport > 5000) {
          if (sensorSlow > 0) log(`perf: sensor handler >40ms on ${sensorSlow} frames in the last 5s`);
          sensorSlow = 0; sensorReport = performance.now();
        }
      });
    });

    $('enableBtn').addEventListener('click', () => drive?.enable().then(() => { log('!MG — enabled'); bus?.publish(T.estop, { active: false }); }));
    $('estopBtn').addEventListener('click', () => {
      bus?.publish(T.estop, { active: true }); // Vda5050Node -> safetyState.eStop MANUAL + stop
      drive?.estop(); path = null; goal = null; bus?.publish(T.path, { path: [] }); log('E-STOP');
    });
    $('clearBtn').addEventListener('click', () => {
      path = null; goal = null; bus?.publish(T.path, { path: [] }); bus?.publish(T.cmd, { left: 0, right: 0 });
    });
    $('resetMapBtn').addEventListener('click', () => { mapNode?.reset(); mapBitmap = null; log('map reset'); });

    const MAP_STORE_KEY = 'mapnode:nav';
    $('saveMapBtn').addEventListener('click', () => {
      if (!mapNode) return;
      try {
        localStorage.setItem(MAP_STORE_KEY, JSON.stringify(mapNode.serialize()));
        log(`map saved to localStorage["${MAP_STORE_KEY}"]`);
      } catch (e) { log(`save failed: ${e.message}`); }
    });
    $('loadMapBtn').addEventListener('click', () => {
      if (!mapNode) return;
      try {
        const raw = localStorage.getItem(MAP_STORE_KEY);
        if (!raw) return log('no saved map in localStorage');
        mapNode.load(JSON.parse(raw));
        mapBitmap = null;
        log('map loaded from localStorage');
      } catch (e) { log(`load failed: ${e.message}`); }
    });

    // iPhone map (slicemap-v1) file -> likelihood field + (if mapping) prior + LocalizationNode
    $('sliceFile').addEventListener('change', async (ev) => {
      const file = ev.target.files?.[0];
      if (!file) return;
      try {
        const parsed = parseSlicemap(JSON.parse(await file.text()));
        // work in slice-local coords (origin 0,0) -- the convention
        // slicemap-to-world.mjs uses, so the sim world, the field, the
        // render and the initial-pose click all share one frame.
        loadedSlice = { ...parsed, origin: [0, 0] };
        const g = slicemapGrid(loadedSlice);
        loadedField = buildLikelihoodField(g, wallMaskFromSlicemap(loadedSlice), { sigmaM: 0.12 });
        setViewGrid(g);
        mapBitmap = null;
        log(`iPhone map "${file.name}": ${g.cols}x${g.rows} @ ${g.cellSize}m, z=${loadedSlice.z}. ` +
            (mapping ? 'restart mapping to use it.' : 'now press "Start mapping".'));
      } catch (e) { log(`slicemap load failed: ${e.message}`); loadedSlice = loadedField = null; }
    });

    $('setPoseBtn').addEventListener('click', () => {
      setPoseArmed = true;
      log('set-pose armed — click the robot\'s spot on the map (heading = current estimate)');
    });

    canvas.addEventListener('click', (ev) => {
      const rect = canvas.getBoundingClientRect();
      const g = toWorld((ev.clientX - rect.left) * (canvas.width / rect.width),
                        (ev.clientY - rect.top) * (canvas.height / rect.height));

      if (setPoseArmed && locNode) {
        setPoseArmed = false;
        locNode.setPose({ x: g.x, y: g.y, theta: fusedPose?.theta ?? 0 });
        fusedPose = { x: g.x, y: g.y, theta: fusedPose?.theta ?? 0 };
        log(`initial pose set to (${g.x.toFixed(2)}, ${g.y.toFixed(2)})`);
        return;
      }

      if (!mapNode || !fusedPose) return log('need Start mapping + a pose first');
      goal = g;
      // plan on the costmap (static walls + live obstacles) when we have one,
      // else MapNode's own inflated grid.
      const map = costmapLatest ?? mapNode.snapshot();
      lastReqId = `req-${++reqSeq}`;
      bus.publish(T.planReq, {
        requestId: lastReqId,
        originX: map.originX, originY: map.originY, cellSize: map.cellSize, cols: map.cols, rows: map.rows,
        occupied: map.occupiedInflated,
        start: { x: fusedPose.x, y: fusedPose.y },
        goal: { x: g.x, y: g.y },
        algorithm: 'gridastar',
      });
      log(`goal (${g.x.toFixed(2)}, ${g.y.toFixed(2)}) — planning ${lastReqId}`);
    });

    // ---------------- VDA5050 (robot side) ----------------
    // Same Vda5050Node as apps/sim-driver, fed by the vendored mqtt.min.js
    // (apps/dashboard/vendor/) over the broker's WebSocket listener (:9001).
    function loadMqttLib() {
      if (window.mqtt) return Promise.resolve(window.mqtt);
      return new Promise((resolve, reject) => {
        const sc = document.createElement('script');
        sc.src = '/apps/dashboard/vendor/mqtt.min.js';
        sc.onload = () => resolve(window.mqtt);
        sc.onerror = () => reject(new Error('vendor/mqtt.min.js failed to load'));
        document.head.appendChild(sc);
      });
    }
    $('vdaBtn').addEventListener('click', async () => {
      if (vdaNode) { vdaNode.close(); mqttClient?.end(); vdaNode = null; mqttClient = null; $('vdaBtn').textContent = 'Connect VDA5050'; $('kVda').textContent = 'off'; return; }
      if (!bus) return log('start mapping first (the bus/follower must exist)');
      const url = $('mqttUrl').value.trim(), serial = $('robotSerial').value.trim();
      if (!url || !serial) return log('broker URL and serial required');
      try {
        const lib = await loadMqttLib();
        const ids = { manufacturer: 'dcrobot', serialNumber: serial };
        mqttClient = lib.connect(url, { clientId: `vda5050-${serial}-${Math.random().toString(16).slice(2, 8)}`, will: Vda5050Node.lastWill(ids), reconnectPeriod: 2000 });
        mqttClient.on('connect', () => { log(`[vda] MQTT connected ${url}`); $('kVda').textContent = `${serial} online @ ${url}`; });
        mqttClient.on('error', (e) => log(`[vda] MQTT error ${e.message || e}`));
        mqttClient.on('offline', () => { $('kVda').textContent = `${serial} offline`; });
        vdaNode = new Vda5050Node(bus, adaptMqttJsClient(mqttClient), {
          ...ids, mapId: loadedSlice?.name ?? 'default',
          poseTopic: T.pose, pathTopic: T.path, cmdTopic: T.cmd, estopTopic: T.estop,
          log: (m) => log(`[vda] ${m}`),
        });
        $('vdaBtn').textContent = 'Disconnect VDA5050';
      } catch (err) {
        log(`[vda] ${err.message || err}`);
      }
    });

    // ---------------- VPS correction (real localization) ----------------
    // Camera frame -> vps-system POST /localize -> correction topic (replaces the
    // ground-truth stand-in while running). Intrinsics: a webcam is roughly
    // fx = fy ~ 0.9*width; a real deployment reads them from the camera manifest.
    async function makeCameraCapture() {
      vpsStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'environment' } });
      const video = document.createElement('video');
      video.srcObject = vpsStream; video.muted = true; await video.play();
      const cv = document.createElement('canvas');
      cv.width = video.videoWidth || 640; cv.height = video.videoHeight || 480;
      const cx = cv.getContext('2d');
      return {
        width: cv.width, height: cv.height,
        capture: () => new Promise((resolve, reject) => {
          cx.drawImage(video, 0, 0, cv.width, cv.height);
          cv.toBlob((b) => (b ? resolve(b) : reject(new Error('toBlob failed'))), 'image/jpeg', 0.85);
        }),
      };
    }
    $('vpsBtn').addEventListener('click', async () => {
      if (vpsNode) { vpsNode.stop(); vpsNode = null; vpsStream?.getTracks().forEach((t) => t.stop()); $('vpsBtn').textContent = 'Start VPS fix'; $('kVps').textContent = 'off'; return; }
      if (!bus) return log('start mapping first');
      const url = $('vpsUrl').value.trim();
      if (!url) return log('VPS URL required');
      try {
        const cam = await makeCameraCapture();
        // Intrinsics: the robot manifest's `camera` block when it has one (the real robot's
        // calibrated values, scaled to the capture size); otherwise a webcam approximation.
        let intr;
        const mc = manifest?.camera;
        if (mc && [mc.fx, mc.fy, mc.cx, mc.cy, mc.width, mc.height].every(Number.isFinite)) {
          const sx = cam.width / mc.width, sy = cam.height / mc.height;
          intr = { fx: mc.fx * sx, fy: mc.fy * sy, cx: mc.cx * sx, cy: mc.cy * sy, width: cam.width, height: cam.height };
          log(`[vps] intrinsics from manifest camera (${mc.width}x${mc.height} -> ${cam.width}x${cam.height})`);
        } else {
          const f = 0.9 * cam.width;
          intr = { fx: f, fy: f, cx: cam.width / 2, cy: cam.height / 2, width: cam.width, height: cam.height };
          log('[vps] no camera block in the manifest -- using the webcam approximation fx = 0.9 * width');
        }
        const localize = createVpsLocalizeClient(url, intr);
        vpsNode = new VpsCorrectionNode(bus, {
          capture: cam.capture, localize, correctionTopic: T.corr, periodMs: 2000,
          onFix: (pose, r) => { $('kVps').textContent = `${r.room_id} · ${pose.x.toFixed(2)}, ${pose.y.toFixed(2)} · inliers ${r.num_inliers}`; },
          onMiss: (e) => { $('kVps').textContent = `miss: ${e.message}`; },
          log: (m) => log(`[vps] ${m}`),
        });
        vpsNode.start();
        $('vpsBtn').textContent = 'Stop VPS fix';
        log(`[vps] correction loop started -> ${url}/localize (ground-truth stand-in paused)`);
      } catch (err) {
        log(`[vps] ${err.message || err}`);
      }
    });
  </script>
</body>
</html>
